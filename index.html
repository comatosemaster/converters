<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Separate raster sizes rather than one scaled file: the 16px icon is
         a simplified "N only" version, because the corner mark of the full
         logo turns into a blurry smudge at that size. No SVG favicon is
         linked on purpose - browsers prefer it over every PNG, which would
         skip that hand-tuned 16px version.
         favicon.ico (16/32/48 inside) is for anything that asks for
         /favicon.ico directly; Google's search results want a 48px multiple.
         The ?v= is a cache-buster - browsers hold on to a favicon far more
         stubbornly than any other asset, and without it the previous mark
         survives a hard refresh. Bump it whenever the icon changes. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      PER-PAGE HEAD.

      scripts/prerender.js replaces the comment below with each page's own
      <title>, description, canonical, Open Graph / Twitter tags and JSON-LD,
      generated from the route registry (src/seo/routes.js). Every URL ships
      its real metadata in the static HTML, so crawlers and link previews
      that never run JavaScript see the right page.

      Deliberately no site-wide defaults here any more: anything left in
      this file would appear on every page alongside the page's own tags.
      In the dev server the comment stays empty and useDocumentMeta fills
      the head in after mount.
    -->
    <!--app-head-->

    <meta name="theme-color" content="#5b3df5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!--
      Applies the dark theme before the page paints, so nobody sees a
      flash of the light theme (still the CSS default with no attribute
      at all) before React mounts and useTheme takes over. Dark is now
      the site's default for a first-time visitor - this only skips
      applying it when someone has EXPLICITLY chosen light before.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') !== 'light') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (error) {
          // Storage disabled (private browsing, locked-down settings) -
          // default to dark anyway for this page load.
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- The build writes each page's prerendered markup in here. -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
